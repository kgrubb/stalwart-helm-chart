{{- include "stalwart.cluster.validate" . }}
{{- $apply := include "stalwart.hasCoordinator" . }}
{{- if and .Values.migration.enabled (not .Values.migration.dataClaim) }}
{{- fail "migration.enabled requires migration.dataClaim" }}
{{- end }}
{{- if and .Values.migration.enabled (eq (index .Values.config "@type" | toString) "RocksDb") }}
{{- fail "migration.enabled requires a shared DataStore (config.@type must not be RocksDb)" }}
{{- end }}
{{- $name := include "stalwart.fullname" . }}
{{- $rocksMarker := printf "%s-migrated" $name }}
{{- $v1Marker := include "stalwart.v1MarkerName" . }}
{{- $hasV1Marker := lookup "v1" "ConfigMap" .Release.Namespace $v1Marker }}
{{- $doRocksMigrate := and .Values.migration.enabled .Values.migration.dataClaim (not (lookup "v1" "ConfigMap" .Release.Namespace $rocksMarker)) }}
{{- $doV1Migrate := and .Release.IsUpgrade .Values.v1Migrate.enabled (not (empty .Values.v1Migrate.sourceConfig)) (not $hasV1Marker) }}
{{- $doV1Mark := or $doV1Migrate (and .Release.IsInstall (not .Values.v1Migrate.enabled)) (and .Values.v1Migrate.alreadyDone (not $hasV1Marker)) }}
{{- $doMigrate := or $doRocksMigrate $doV1Migrate }}
{{- $url := default (printf "http://%s:%v" $name .Values.service.ports.mgmt) .Values.apply.apiUrl }}
{{- if or $apply $doMigrate $doV1Mark }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-hooks
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade,post-install,post-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-hooks
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade,post-install,post-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "update", "patch"{{- if $doMigrate }}, "delete"{{- end }}]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"{{- if $doMigrate }}, "delete"{{- end }}]
  {{- if or $doMigrate $doV1Mark }}
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-hooks
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade,post-install,post-upgrade
    helm.sh/hook-weight: "-19"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-hooks
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-hooks
{{- end }}
{{- if $doMigrate }}
---
# Separate Job so RWO PVC attach does not deadlock scale-down.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate-prepare
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-6"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: {{ if $doV1Migrate }}{{ .Values.v1Migrate.ttlSecondsAfterFinished }}{{ else }}{{ .Values.migration.ttlSecondsAfterFinished }}{{ end }}
  template:
    metadata:
      labels:
        {{- include "stalwart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}-hooks
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prepare
          image: {{ .Values.apply.kubectlImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ns="$STALWART_NAMESPACE" sts="$STALWART_STS_NAME"
              kubectl get sts -n "$ns" "$sts" >/dev/null 2>&1 || exit 0
              kubectl scale sts -n "$ns" "$sts" --replicas=0
              kubectl wait -n "$ns" --for=delete pod \
                -l "app.kubernetes.io/name=$STALWART_NAME,app.kubernetes.io/instance=$STALWART_INSTANCE,app.kubernetes.io/component=server" \
                --timeout=300s
              vct="$(kubectl get sts -n "$ns" "$sts" -o jsonpath='{.spec.volumeClaimTemplates}' 2>/dev/null || true)"
              if [ -n "$vct" ] && [ "$vct" != "null" ] && [ "$vct" != "[]" ]; then
                kubectl delete sts -n "$ns" "$sts" --cascade=orphan
              fi
          {{- include "stalwart.hooks.containerSecurity" (dict "uid" 65534) | nindent 10 }}
          env:
            - name: STALWART_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: STALWART_STS_NAME
              value: {{ $name | quote }}
            - name: STALWART_NAME
              value: {{ include "stalwart.name" . | quote }}
            - name: STALWART_INSTANCE
              value: {{ .Release.Name | quote }}
{{- end }}
{{- if $doRocksMigrate }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-migrate
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-18"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  migrate.sh: |
{{ .Files.Get "files/migrate.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "stalwart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}-hooks
      securityContext:
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/migrate.sh"]
          {{- include "stalwart.hooks.containerSecurity" (dict "uid" 2000 "noDrop" true) | nindent 10 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: STORE_JSON
              value: {{ .Values.config | toJson | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/stalwart
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: export
              mountPath: /export
            - name: tmp
              mountPath: /tmp
      containers:
        - name: mark
          image: {{ .Values.apply.kubectlImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              kubectl create configmap -n "$STALWART_NAMESPACE" "$MIGRATION_MARKER" \
                --from-literal=status=migrated --from-literal=claim="$DATA_CLAIM" \
                --dry-run=client -o yaml | kubectl apply -f -
          {{- include "stalwart.hooks.containerSecurity" (dict "uid" 65534) | nindent 10 }}
          env:
            - name: STALWART_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: MIGRATION_MARKER
              value: {{ $rocksMarker | quote }}
            - name: DATA_CLAIM
              value: {{ .Values.migration.dataClaim | quote }}
      volumes:
        - name: scripts
          configMap:
            name: {{ $name }}-migrate
            defaultMode: 0555
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.migration.dataClaim | quote }}
        - name: export
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
{{- if $doV1Migrate }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-v1-migrate
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-18"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  v1-migrate.sh: |
{{ .Files.Get "files/v1-migrate.sh" | indent 4 }}
  answers.toml: |
{{ include "stalwart.v1Migrate.answers" . | indent 4 }}
---
# Job success is migrate success only. Marker is a separate Job so a ConfigMap
# blip cannot force a remigrate into a non-empty target.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-v1-migrate
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    app.kubernetes.io/component: v1-migrate
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.v1Migrate.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.v1Migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "stalwart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: v1-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}-hooks
      securityContext:
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ .Values.v1Migrate.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/v1-migrate.sh"]
          {{- include "stalwart.hooks.containerSecurity" (dict "uid" 2000 "noDrop" true) | nindent 10 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: SOURCE_JSON
              value: {{ .Values.v1Migrate.sourceConfig | toJson | quote }}
            - name: TARGET_JSON
              value: {{ .Values.config | toJson | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: answers
              mountPath: /answers
              readOnly: true
            - name: state
              mountPath: /var/lib/stalwart-migrate
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: {{ $name }}-v1-migrate
            items:
              - key: v1-migrate.sh
                path: v1-migrate.sh
            defaultMode: 0555
        - name: answers
          configMap:
            name: {{ $name }}-v1-migrate
            items:
              - key: answers.toml
                path: answers.toml
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
{{- if $doV1Mark }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-v1-mark
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    app.kubernetes.io/component: v1-mark
  annotations:
    helm.sh/hook: pre-upgrade,post-install
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: {{ .Values.v1Migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "stalwart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: v1-mark
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $name }}-hooks
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mark
          image: {{ .Values.apply.kubectlImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              kubectl create configmap -n "$STALWART_NAMESPACE" "$MIGRATION_MARKER" \
                --from-literal=status=migrated \
                --dry-run=client -o yaml | kubectl apply -f -
          {{- include "stalwart.hooks.containerSecurity" (dict "uid" 65534) | nindent 10 }}
          env:
            - name: STALWART_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: MIGRATION_MARKER
              value: {{ $v1Marker | quote }}
{{- end }}
{{- if $apply }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-apply
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  plan.ndjson: |
    {"@type":"update","object":"InMemoryStore","value":{{ include "stalwart.inMemoryObject" . }}}
    {"@type":"update","object":"Coordinator","value":{{ include "stalwart.coordinatorObject" . }}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-apply
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    app.kubernetes.io/component: apply
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: {{ .Values.apply.ttlSecondsAfterFinished }}
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "stalwart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: apply
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $name }}-hooks
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              curl -fsS --connect-timeout 5 --retry 60 --retry-delay 5 --retry-all-errors \
                -u "${STALWART_USER}:${STALWART_PASSWORD}" \
                "${STALWART_URL%/}/healthz/ready"
          {{- include "stalwart.hooks.containerSecurity" (dict "uid" 100 "gid" 101) | nindent 10 }}
          env:
            - name: STALWART_URL
              value: {{ $url | quote }}
            {{- include "stalwart.apply.authEnv" . | nindent 12 }}
        - name: apply
          image: {{ .Values.apply.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["apply", "--file", "/plan/plan.ndjson"]
          {{- include "stalwart.hooks.containerSecurity" (dict "noDrop" true) | nindent 10 }}
          env:
            - name: STALWART_URL
              value: {{ $url | quote }}
            {{- include "stalwart.apply.authEnv" . | nindent 12 }}
          volumeMounts:
            - name: plan
              mountPath: /plan
              readOnly: true
      containers:
        - name: restart
          image: {{ .Values.apply.kubectlImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ns="$STALWART_NAMESPACE"
              sts="$STALWART_STS_NAME"
              ann="stalwart.io/coordinator-plan-hash"
              hash="$(sha256sum /plan/plan.ndjson | awk '{print $1}')"
              prev="$(kubectl -n "$ns" get sts "$sts" -o jsonpath="{.metadata.annotations.stalwart\.io/coordinator-plan-hash}" 2>/dev/null || true)"
              if [ -n "$prev" ] && [ "$hash" = "$prev" ]; then
                echo "coordinator plan unchanged, skip STS bounce"
                exit 0
              fi
              kubectl -n "$ns" rollout restart "sts/$sts"
              kubectl -n "$ns" rollout status "sts/$sts" --timeout=600s
              kubectl -n "$ns" annotate sts "$sts" "$ann=$hash" --overwrite
          {{- include "stalwart.hooks.containerSecurity" (dict "uid" 65534) | nindent 10 }}
          env:
            - name: STALWART_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: STALWART_STS_NAME
              value: {{ $name | quote }}
          volumeMounts:
            - name: plan
              mountPath: /plan
              readOnly: true
      volumes:
        - name: plan
          configMap:
            name: {{ $name }}-apply
{{- end }}
