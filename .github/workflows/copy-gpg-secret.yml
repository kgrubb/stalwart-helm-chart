name: Copy GPG secret (one-shot)

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy GPG_PRIVATE_KEY to nostalgiatv-helm-chart
        env:
          GH_TOKEN: ${{ secrets.TEMP_CROSS_REPO_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gh secret set GPG_PRIVATE_KEY --repo kgrubb/nostalgiatv-helm-chart
          echo "Secret set successfully"
          gh secret list --repo kgrubb/nostalgiatv-helm-chart
