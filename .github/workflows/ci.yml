name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Lint YAML
        run: |
          pipx install yamllint
          yamllint .

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Lint chart
        run: |
          helm dependency build charts/stalwart
          helm lint charts/stalwart --strict

      - name: Render chart
        run: |
          helm template test charts/stalwart
          helm template test charts/stalwart | grep -q 'kind: StatefulSet'
          if helm template test charts/stalwart | grep -qE 'kind: (PodDisruptionBudget|ServiceMonitor)'; then
            echo "default render must not include PDB or ServiceMonitor"
            exit 1
          fi
          if helm template test charts/stalwart | grep -q 'app.kubernetes.io/name: valkey'; then
            echo "default render must not include valkey subchart"
            exit 1
          fi
          if helm template test charts/stalwart --is-upgrade 2>/dev/null; then
            echo "upgrade without v1 migrate marker or alreadyDone must fail"
            exit 1
          fi
          helm template test charts/stalwart --is-upgrade --set v1Migrate.alreadyDone=true \
            | grep -q 'kind: StatefulSet'
          helm template test charts/stalwart | grep -q 'component: v1-mark'
          helm template test charts/stalwart --set recoveryAdmin.enabled=false
          helm template test charts/stalwart \
            --set recoveryAdmin.enabled=true \
            --set recoveryAdmin.existingSecret=recovery-admin
          helm template test charts/stalwart \
            --set recoveryAdmin.password=ci-only \
            --set bootstrap.enabled=true \
            --set bootstrap.domain=example.org \
            --set bootstrap.oidc.issuerUrl=https://sso.example.org/realms/mail
          helm template test charts/stalwart \
            --set recoveryAdmin.existingSecret=recovery-admin \
            --set bootstrap.domain=example.org \
            --set mailTls.enabled=true \
            --set mailTls.existingSecret=stalwart-tls \
            --set mailTls.hostname=mail.example.org
          helm template test charts/stalwart \
            --set mailService.enabled=true \
            --set mailService.name=stalwart-mail
          helm template test charts/stalwart -f charts/stalwart/ci/ha-cluster-values.yaml \
            > /tmp/ha-render.yaml
          grep -q 'component: apply' /tmp/ha-render.yaml
          grep -q 'plan.ndjson' /tmp/ha-render.yaml
          grep -q '"object":"InMemoryStore"' /tmp/ha-render.yaml
          grep -q '"object":"Coordinator"' /tmp/ha-render.yaml
          grep -q 'test-valkey' /tmp/ha-render.yaml
          grep -q 'app.kubernetes.io/name: valkey' /tmp/ha-render.yaml
          grep -q 'redis://test-valkey.default.svc:6379' /tmp/ha-render.yaml
          # InMemoryStore line must precede Coordinator in the apply plan.
          awk '
            /plan.ndjson:/{f=1}
            f && /InMemoryStore/{i=NR}
            f && /Coordinator/{c=NR}
            END{exit !(i && c && i<c)}
          ' /tmp/ha-render.yaml
          helm template test charts/stalwart \
            -f charts/stalwart/ci/ha-cluster-values.yaml \
            --set valkey.fullnameOverride=myvk \
            | grep -q 'redis://myvk.default.svc:6379'
          helm template test charts/stalwart \
            -f charts/stalwart/ci/ha-cluster-values.yaml \
            --set valkey.service.port=6380 \
            | grep -q 'redis://test-valkey.default.svc:6380'
          if helm template test charts/stalwart \
            -f charts/stalwart/ci/ha-cluster-values.yaml \
            --set valkey.auth.enabled=true \
            --set-json 'valkey.auth.aclUsers={"default":{"permissions":"~* &* +@all","password":"x"}}' \
            2>/dev/null; then
            echo "valkey.auth.enabled without coordinator must fail"
            exit 1
          fi
          grep -q 'healthz/ready' /tmp/ha-render.yaml
          grep -q 'rollout restart' /tmp/ha-render.yaml
          grep -q 'coordinator-plan-hash' /tmp/ha-render.yaml
          grep -q 'plan unchanged, skip STS bounce' /tmp/ha-render.yaml
          grep -q 'sha256sum /plan/plan.ndjson' /tmp/ha-render.yaml
          grep -q 'kind: PodDisruptionBudget' /tmp/ha-render.yaml
          grep -A20 'kind: PodDisruptionBudget' /tmp/ha-render.yaml | grep -q 'component: server'
          grep -q 'stalwartlabs/cli:1.0.13' /tmp/ha-render.yaml
          grep -q 'alpine/kubectl:1.37.1' /tmp/ha-render.yaml
          helm template test charts/stalwart \
            -f charts/stalwart/ci/ha-cluster-values.yaml \
            -f charts/stalwart/ci/migrate-values.yaml \
            > /tmp/migrate-render.yaml
          grep -q 'component: migrate' /tmp/migrate-render.yaml
          grep -q 'app.kubernetes.io/component=server' /tmp/migrate-render.yaml
          if helm template test charts/stalwart \
            -f charts/stalwart/ci/ha-cluster-values.yaml \
            --set config.@type=RocksDb 2>/dev/null; then
            echo "replicaCount > 1 with RocksDb must fail"
            exit 1
          fi
          if helm template test charts/stalwart \
            -f charts/stalwart/ci/ha-cluster-values.yaml \
            -f charts/stalwart/ci/v1-migrate-values.yaml 2>/dev/null; then
            echo "v1Migrate on install must fail (upgrade-only)"
            exit 1
          fi
          helm template test charts/stalwart \
            -f charts/stalwart/ci/ha-cluster-values.yaml \
            -f charts/stalwart/ci/v1-migrate-values.yaml \
            --is-upgrade \
            > /tmp/v1-migrate-render.yaml
          grep -q 'statefulsets/scale' /tmp/v1-migrate-render.yaml
          grep -q 'poddisruptionbudgets' /tmp/v1-migrate-render.yaml
          grep -q 'delete pdb' /tmp/v1-migrate-render.yaml
          grep -q 'component: v1-migrate' /tmp/v1-migrate-render.yaml
          grep -q 'component: v1-mark' /tmp/v1-migrate-render.yaml
          grep -q 'stalwartlabs/stalwart-migrate:1.0.0' /tmp/v1-migrate-render.yaml
          grep -q 'in_memory_cluster' /tmp/v1-migrate-render.yaml
          grep -q 'http_forwarded' /tmp/v1-migrate-render.yaml
          grep -q 'stalwart_v1' /tmp/v1-migrate-render.yaml
          python3 charts/stalwart/ci/check-v1-migrate-render.py /tmp/v1-migrate-render.yaml
          if helm template test charts/stalwart \
            -f charts/stalwart/ci/ha-cluster-values.yaml \
            --set v1Migrate.enabled=true \
            --is-upgrade 2>/dev/null; then
            echo "v1Migrate without sourceConfig must fail"
            exit 1
          fi

      - name: Lint manifests
        uses: stackrox/kube-linter-action@v1
        with:
          directory: charts/stalwart
          config: .kube-linter.yaml
